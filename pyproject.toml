[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[project]
name = "cinespine"
version = "0.1.0"
description = "Append-Only Event Spine & 3-Axis Discrepancy Reconciliation Engine for Film & TV"
authors = [{ name = "Francisco Tena", email = "ftenaf@yahoo.es" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # Imported directly by backend/app/main.py to load .env in local runs.
    "python-dotenv>=1.0.0",
    "clickhouse-connect>=0.7.0",
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.14.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-documentai>=3.15.0",
    "google-cloud-speech>=2.26.0",
    "google-cloud-videointelligence>=2.13.0",
    "google-cloud-pubsub>=2.39.2",
    # backend/app/agents/__init__.py imports the queue and wrap-rescue agents at
    # import time and both subclass adk.agents.LlmAgent, so this is required to
    # import the app at all -- not optional, whatever the extra below implies.
    "google-adk>=1.0.0",
    # Imported lazily by backend/app/core/analytics.py, which degrades to a
    # warning when it is absent. Declared anyway so the lock carries it: it was
    # hand-appended to backend/requirements.txt before, where the next
    # `uv pip compile` would have silently dropped it.
    "posthog>=3.0.0",
    "fastmcp>=3.2.0",
    "opentelemetry-distro>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-logging>=0.45b0",
    "openlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
hackathon = [
    "mcp-clickhouse>=0.1.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "asyncio: mark test as async",
    "anyio: mark test as anyio",
]


[tool.ruff]
line-length = 100
target-version = "py311"

# CI gates on this set. It is deliberately narrow: these are rules where a hit
# means a probable defect, not a style preference, so the check stays worth
# reading. The style families (UP, I, F401) are not enabled yet -- roughly 800
# outstanding violations -- and should be adopted one family at a time, each
# with its own mechanical commit, rather than as one unreviewable sweep.
[tool.ruff.lint]
select = [
    "E9",    # syntax errors and IO errors
    "F63",   # comparisons that are always true or always false
    "F7",    # break/return outside a loop or function
    "F82",   # undefined names
    "B008",  # function call in a default argument
    "B023",  # closure over a loop variable
    "S110",  # try/except/pass, which hides the failure it catches
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole parameter API is calls in argument defaults, evaluated once
# at import and treated as declarations. B008 is a false positive on all of it.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Security",
    "fastapi.UploadFile",
]
