# Named explicitly rather than derived from the directory. Every compose file
# here used to default to `cinespine`, so a `--remove-orphans` against one
# reached the containers of another: testing the PostHog stack took down this
# one's ClickHouse, along with Grafana and Prometheus.
#
# This one keeps the name it already had, deliberately. The project name is
# part of a volume's name, so changing it would orphan
# `cinespine_clickhouse_data` and the spine's analytical mirror would come back
# empty, which looks exactly like a mirror that was never written to.
name: cinespine

services:
  # ClickHouse OLAP Event Spine
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: cinespine-clickhouse
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # Native client
    environment:
      CLICKHOUSE_DB: cinespine
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

# Grafana is defined in docker-compose.observability.yml and nowhere else.
# There used to be a second one here with the same container name and the same
# port; a shared project name let Compose treat the two as one service, so the
# last `up` quietly won and nobody noticed. The volume it declared,
# cinespine_grafana_data, was never written to -- the running Grafana uses bind
# mounts -- and is left on disk rather than removed here.
volumes:
  clickhouse_data:
