name: cinespine

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GRAFANA_FARO_URL=${VITE_GRAFANA_FARO_URL}
    container_name: cinespine-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cinespine-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_MCP_URL=http://mcp-clickhouse:4200/mcp
    depends_on:
      - clickhouse
      - mcp-clickhouse
    volumes:
      - .:/app
      - C:\Users\paco\AppData\Roaming\gcloud\application_default_credentials.json:/app/gcp-credentials.json:ro

  mcp-clickhouse:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cinespine-mcp-clickhouse
    ports:
      - "4200:4200"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_MCP_SERVER_TRANSPORT=http
      - CLICKHOUSE_MCP_BIND_HOST=0.0.0.0
      - CLICKHOUSE_MCP_BIND_PORT=4200
      - CLICKHOUSE_MCP_AUTH_DISABLED=true
    command: [ "uv", "run", "mcp-clickhouse" ]
    depends_on:
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: cinespine-clickhouse
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # Native client
    environment:
      CLICKHOUSE_DB: cinespine
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Observability Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: cinespine-prometheus
    profiles: [ "observability" ]
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    # Two intake paths, because the two metric systems arrive differently.
    # cinespine_* is prometheus_client, scraped from /api/metrics. gen_ai_* is
    # the OTel meter provider, which pushes and is never scraped -- so without
    # the OTLP receiver the local stack sees only half the metrics and the AI
    # dashboard is dead here while working in Grafana Cloud.
    #
    # `command` replaces the image's CMD rather than extending it, so the
    # defaults have to be restated alongside the new flag.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-otlp-receiver
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: cinespine-grafana
    profiles: [ "observability" ]
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

volumes:
  clickhouse_data:
