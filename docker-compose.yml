name: cinespine

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GRAFANA_FARO_URL=${VITE_GRAFANA_FARO_URL}
    container_name: cinespine-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cinespine-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_MCP_URL=http://mcp-clickhouse:4200/mcp
      # This container is deployment.environment=local. With .env pointing
      # OTEL_EXPORTER_OTLP_ENDPOINT at Grafana Cloud it exports nothing and
      # says so at boot; a laptop run once pushed 2,400 error lines into the
      # production stack that way. Point it at the local receiver instead
      # (http://prometheus:9090/api/v1/otlp, observability profile) or set
      # CINESPINE_TELEMETRY_REMOTE_OK=1 to push into Cloud on purpose.
    depends_on:
      - clickhouse
      - mcp-clickhouse
    volumes:
      - .:/app
      - C:\Users\paco\AppData\Roaming\gcloud\application_default_credentials.json:/app/gcp-credentials.json:ro

  mcp-clickhouse:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cinespine-mcp-clickhouse
    ports:
      - "4200:4200"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_MCP_SERVER_TRANSPORT=http
      - CLICKHOUSE_MCP_BIND_HOST=0.0.0.0
      - CLICKHOUSE_MCP_BIND_PORT=4200
      - CLICKHOUSE_MCP_AUTH_DISABLED=true
    command: [ "uv", "run", "mcp-clickhouse" ]
    depends_on:
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: cinespine-clickhouse
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # Native client
    environment:
      CLICKHOUSE_DB: cinespine
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Observability Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: cinespine-prometheus
    profiles: [ "observability" ]
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    # One intake. Every metric family is OTel and pushed, so Prometheus is
    # here for its OTLP receiver and nothing else; there is no scrape job.
    #
    # `command` replaces the image's CMD rather than extending it. The image's
    # CMD is exactly the first two flags, restated here so the receiver flag
    # can be added.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: cinespine-grafana
    profiles: [ "observability" ]
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

volumes:
  clickhouse_data:
