name: CineSpine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede a PR's earlier runs when new commits arrive, but let pushes to main
# finish: cancelling those would leave a commit on the default branch with no
# recorded verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    # Typically ~70s; this catches a hung step without tripping on a cold cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # backend/requirements.txt is the pinned lock compiled from pyproject.toml.
          # --no-deps keeps the editable install from resolving past those pins.
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      - name: Run Ruff
        run: ruff check backend

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest -v

  build-frontend:
    runs-on: ubuntu-latest
    # Typically ~25s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

