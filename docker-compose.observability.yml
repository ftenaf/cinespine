# Its own project, so a teardown here cannot reach the spine's ClickHouse or
# the PostHog stack. Safe to rename, unlike docker-compose.yml: everything
# below is a bind mount, so no named volume changes identity.
#
# Grafana is defined here and nowhere else. docker-compose.yml used to declare
# a second one with the same container name and port. While both files shared a
# project name Compose treated them as one service and the last `up` won, which
# is why it went unnoticed; as separate projects they would collide outright.
name: cinespine-observability

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: cinespine-prometheus
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: cinespine-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
